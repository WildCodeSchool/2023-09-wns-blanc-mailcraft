version: '3'

services:
  backend:
    image: drissb45/2023-09-wns-blanc-mailcraft-backend:latest
    env_file: .env
    ports:
      - 4000:3001

  frontend:
    image: drissb45/2023-09-wns-blanc-mailcraft-frontend:latest
    env_file: .env
    ports:
      - 3000:3000

  db:
    image: postgres
    restart: always
    env_file: .env
    volumes:
      - ./dbData:/var/lib/postgresql/data/customDataFolder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_NAME} -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.21.3
    depends_on:
      - server
      - client
    restart: always
    ports:
      - ${GATEWAY_PORT}:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - web-client-build:/web-client-build
      - ./logs:/var/log/nginx
volumes:
  web-client-build:
